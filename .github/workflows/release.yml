name: Release Build

on:
  push:
    tags:
      - 'v*.*.*'

permissions: write-all

env:
  CARGO_BUILD_JOBS: 1
  CARGO_INCREMENTAL: 0
  HUSKY: 0
  RUST_BACKTRACE: short

concurrency:
  group: '${{ github.workflow }} - ${{ github.ref }}'
  cancel-in-progress: false

jobs:
  check_tag_version:
    name: Check release tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check tag is on main
        run: |
          git fetch origin main:refs/remotes/origin/main --depth=1
          TAG_COMMIT="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          MAIN_COMMIT="$(git rev-parse origin/main)"
          if [ "$TAG_COMMIT" != "$MAIN_COMMIT" ]; then
            echo "Tag $GITHUB_REF_NAME must point to the current origin/main HEAD."
            exit 1
          fi

      - name: Check tag matches package version
        run: |
          if ! echo "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Stable release workflow only accepts vX.Y.Z tags."
            exit 1
          fi

          PKG_VERSION="$(jq -r .version package.json)"
          EXPECTED_TAG="v$PKG_VERSION"
          if [ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]; then
            echo "Version mismatch: tag=$GITHUB_REF_NAME package=$EXPECTED_TAG"
            exit 1
          fi

  release:
    name: Build Windows x64 installer
    runs-on: windows-latest
    needs: [check_tag_version]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.91.0'
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: 'v1-rust'
          key: 'rust-shared-stable-windows-latest-x86_64-pc-windows-msvc'
          workspaces: |
            . -> target
          cache-all-crates: true
          cache-workspace-crates: true

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.14.1'

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Install dependencies and sidecars
        run: |
          pnpm i
          pnpm run prebuild x86_64-pc-windows-msvc

      - name: Tauri build
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'XXLink ${{ github.ref_name }}'
          releaseBody: 'bug fix'
          releaseDraft: false
          prerelease: false
          tauriScript: pnpm
          args: --target x86_64-pc-windows-msvc
          includeUpdaterJson: true

  release_update:
    name: Publish updater manifest
    runs-on: ubuntu-latest
    needs: [release]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.14.1'

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm i

      - name: Release updater file
        run: pnpm updater
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
