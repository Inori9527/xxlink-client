name: Clippy Lint

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
env:
  HUSKY: 0

jobs:
  clippy:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24.14.1'

      - name: Resolve CI range
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "CI_BASE_SHA=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
            echo "CI_HEAD_SHA=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" = "push" ]; then
            if [ -z "${{ github.event.before }}" ] || [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
              echo "Unable to determine push base SHA." >&2
              exit 1
            fi
            echo "CI_BASE_SHA=${{ github.event.before }}" >> "$GITHUB_ENV"
            echo "CI_HEAD_SHA=${{ github.sha }}" >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git fetch origin main
            echo "CI_BASE_SHA=origin/main" >> "$GITHUB_ENV"
            echo "CI_HEAD_SHA=HEAD" >> "$GITHUB_ENV"
          else
            echo "Unsupported event: ${{ github.event_name }}" >&2
            exit 1
          fi

      - name: Check Rust impact
        id: rust_scope
        run: node scripts/ci/check-scope.mjs rust-impact

      - name: Install Rust Stable
        if: steps.rust_scope.outputs.has_rust_impact == 'true' || github.event_name == 'workflow_dispatch'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy

      - name: Add Rust Target
        if: steps.rust_scope.outputs.has_rust_impact == 'true' || github.event_name == 'workflow_dispatch'
        run: rustup target add ${{ matrix.target }}

      - name: Rust Cache
        if: steps.rust_scope.outputs.has_rust_impact == 'true' || github.event_name == 'workflow_dispatch'
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/dev' }}
          prefix-key: 'v1-rust'
          key: 'rust-shared-stable-${{ matrix.os }}-${{ matrix.target }}'
          workspaces: |
            . -> target
          cache-all-crates: true
          cache-workspace-crates: true

      - name: Install dependencies (ubuntu only)
        if: matrix.os == 'ubuntu-22.04' && (steps.rust_scope.outputs.has_rust_impact == 'true' || github.event_name == 'workflow_dispatch')
        run: |
          sudo apt-get update
          sudo apt-get install -y libxslt1.1 libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Run Clippy
        if: steps.rust_scope.outputs.has_rust_impact == 'true' || github.event_name == 'workflow_dispatch'
        env:
          TAURI_CONFIG: '{"bundle":{"externalBin":[],"resources":[]}}'
        run: node scripts/ci/check-scope.mjs clippy --target-triple ${{ matrix.target }}

      - name: Run runtime boundary unit tests
        if: steps.rust_scope.outputs.has_rust_impact == 'true' || github.event_name == 'workflow_dispatch'
        env:
          TAURI_CONFIG: '{"bundle":{"externalBin":[],"resources":[]}}'
        run: cargo test --target ${{ matrix.target }} --workspace --all-features --lib runtime_boundary_tests

      - name: Run Logging Check
        if: steps.rust_scope.outputs.has_rust_impact == 'true' || github.event_name == 'workflow_dispatch'
        working-directory: ./src-tauri
        shell: bash
        run: |
          cargo install --git https://github.com/clash-verge-rev/clash-verge-logging-check.git
          clash-verge-logging-check
