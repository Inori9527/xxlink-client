name: Check Formatting

on:
  pull_request:
  push:
    branches:
      - main

env:
  HUSKY: 0

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24.14.1'

      - name: Resolve CI range
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "CI_BASE_SHA=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
            echo "CI_HEAD_SHA=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" = "push" ]; then
            if [ -z "${{ github.event.before }}" ] || [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
              echo "Unable to determine push base SHA." >&2
              exit 1
            fi
            echo "CI_BASE_SHA=${{ github.event.before }}" >> "$GITHUB_ENV"
            echo "CI_HEAD_SHA=${{ github.sha }}" >> "$GITHUB_ENV"
          else
            echo "Unsupported event: ${{ github.event_name }}" >&2
            exit 1
          fi

      - name: install Rust stable and rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Run scoped rustfmt check
        run: node scripts/ci/check-scope.mjs rustfmt

