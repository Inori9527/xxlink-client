name: Frontend Check

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  HUSKY: 0

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve CI range
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "CI_BASE_SHA=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
            echo "CI_HEAD_SHA=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" = "push" ]; then
            if [ -z "${{ github.event.before }}" ] || [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
              echo "Unable to determine push base SHA." >&2
              exit 1
            fi
            echo "CI_BASE_SHA=${{ github.event.before }}" >> "$GITHUB_ENV"
            echo "CI_HEAD_SHA=${{ github.sha }}" >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git fetch origin main
            echo "CI_BASE_SHA=origin/main" >> "$GITHUB_ENV"
            echo "CI_HEAD_SHA=HEAD" >> "$GITHUB_ENV"
          else
            echo "Unsupported event: ${{ github.event_name }}" >&2
            exit 1
          fi

      - name: Check frontend changes
        id: check_frontend
        uses: dorny/paths-filter@v4
        with:
          filters: |
            frontend:
              - 'src/**'
              - '**/*.cjs'
              - '**/*.html'
              - '**/*.js'
              - '**/*.jsx'
              - '**/*.mjs'
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.css'
              - '**/*.scss'
              - '**/*.json'
              - '**/*.md'
              - '**/*.toml'
              - '**/*.yaml'
              - '**/*.yml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'eslint.config.ts'
              - 'tsconfig.json'
              - 'vite.config.*'
              # G1 item 1(ii): the exact files this job's guards read, derived by
              # instrumenting fs during a real run of each guard rather than by
              # pattern-matching their source. Listed individually, not as
              # 'src-tauri/**': only these are inputs to a guard this job runs.
              # The seven that do not exist are absence assertions -- recreating
              # one must trigger this job, which is why they are here.
              # Before this list, no filter entry matched .rs or .nsi at all, so an
              # installer-only change ran none of these guards.
              - 'src-tauri/packages/windows/installer.nsi'
              - 'src-tauri/src/cmd/app.rs'
              - 'src-tauri/src/cmd/clash.rs'
              - 'src-tauri/src/cmd/lightweight.rs'
              # A DIRECTORY absence assertion (test-retired-tauri-commands.mjs):
              # recreating any file under it must trigger the job. The first
              # version of this list dropped it, because the list was filtered to
              # entries with a file extension -- a rule that silently removed the
              # one input that is not a file.
              - 'src-tauri/src/cmd/media_unlock_checker/**'
              - 'src-tauri/src/cmd/mod.rs'
              - 'src-tauri/src/cmd/network.rs'
              - 'src-tauri/src/cmd/oauth.rs'
              - 'src-tauri/src/cmd/profile.rs'
              - 'src-tauri/src/cmd/proxy.rs'
              - 'src-tauri/src/cmd/runtime.rs'
              - 'src-tauri/src/cmd/runtime_action_controller.rs'
              - 'src-tauri/src/cmd/save_profile.rs'
              - 'src-tauri/src/cmd/secure_session.rs'
              - 'src-tauri/src/cmd/service.rs'
              - 'src-tauri/src/cmd/uwp.rs'
              - 'src-tauri/src/cmd/validate.rs'
              - 'src-tauri/src/config/profiles.rs'
              - 'src-tauri/src/config/runtime.rs'
              - 'src-tauri/src/core/manager/config.rs'
              - 'src-tauri/src/core/mod.rs'
              - 'src-tauri/src/core/sysopt.rs'
              - 'src-tauri/src/core/timer.rs'
              - 'src-tauri/src/core/validate.rs'
              - 'src-tauri/src/core/win_uwp.rs'
              - 'src-tauri/src/enhance/mod.rs'
              - 'src-tauri/src/feat/clash.rs'
              - 'src-tauri/src/feat/config.rs'
              - 'src-tauri/src/lib.rs'
              - 'src-tauri/src/module/lightweight.rs'
              - 'src-tauri/src/utils/init.rs'
              - 'src-tauri/src/utils/resolve/scheme.rs'
              - 'src-tauri/src/utils/server.rs'

      - name: Skip if no frontend changes
        if: steps.check_frontend.outputs.frontend != 'true' && github.event_name != 'workflow_dispatch'
        run: echo "No frontend changes, skipping frontend checks."

      - name: Install pnpm
        if: steps.check_frontend.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - uses: actions/setup-node@v6
        if: steps.check_frontend.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
        with:
          node-version: '24.14.1'
          cache: 'pnpm'

      - name: Restore pnpm cache
        if: steps.check_frontend.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/cache@v5
        with:
          path: ~/.pnpm-store
          key: "pnpm-shared-stable-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}"
          restore-keys: |
            pnpm-shared-stable-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
        if: steps.check_frontend.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'

      - name: Run Prettier check
        if: steps.check_frontend.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
        run: node scripts/ci/check-scope.mjs prettier

      - name: Run ESLint
        if: steps.check_frontend.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
        run: pnpm lint

      - name: Run TypeScript typecheck
        if: steps.check_frontend.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
        run: pnpm typecheck

      - name: Validate packaged CSP and Tauri build guard
        if: steps.check_frontend.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
        run: node --test scripts/test-tauri-cli-arguments.mjs && node scripts/validate-csp-policy.mjs

      - name: Validate runtime and platform boundary
        if: steps.check_frontend.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
        run: pnpm test:runtime-boundary

      - name: Validate consumer continuity
        if: steps.check_frontend.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
        run: pnpm test:consumer-continuity
